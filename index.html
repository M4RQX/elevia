<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Soma Studio — Estúdio digital</title>
<meta name="description" content="Estúdio digital. Sites e produtos web para empresas em Portugal." />
<meta property="og:title" content="Soma Studio" />
<meta property="og:description" content="Sites e produtos web para empresas em Portugal." />
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="%23181614"/><text x="50%" y="68%" text-anchor="middle" fill="%23f4f0e8" font-family="Georgia,serif" font-size="20" font-style="italic" font-weight="500">S</text></svg>' />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #f4f0e8;
    --bg-elev: #ffffff;
    --bg-soft: #ede8dd;
    --line: rgba(24, 22, 20, 0.10);
    --line-mid: rgba(24, 22, 20, 0.22);
    --text: #181614;
    --text-soft: #3d3934;
    --text-mute: #7a766e;
    --text-dim: #b3afa5;
    --accent: #b85c38;
    --accent-soft: rgba(184, 92, 56, 0.10);
    --serif: 'Instrument Serif', 'Georgia', serif;
    --sans: 'Geist', system-ui, -apple-system, sans-serif;
    --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100dvh;
  }
  body.modal-open { overflow: hidden; }

  a { color: inherit; text-decoration: none; }
  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 3px;
  }

  .container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 clamp(1.5rem, 4vw, 3rem);
  }

  /* ===== HEADER ===== */
  header {
    padding: clamp(2rem, 5vw, 3.5rem) 0 clamp(3rem, 8vw, 5rem);
  }
  .head-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 2rem;
    flex-wrap: wrap;
  }
  .brand { display: flex; flex-direction: column; gap: 0.85rem; }
  .brand h1 {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: clamp(2.75rem, 7vw, 5rem);
    letter-spacing: -0.02em;
    line-height: 0.95;
    color: var(--text);
  }
  .brand h1 .acc { font-style: italic; color: var(--accent); }
  .brand .tagline {
    font-size: clamp(0.95rem, 1.4vw, 1.0625rem);
    color: var(--text-soft);
    max-width: 32rem;
    line-height: 1.5;
  }
  .head-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.4rem;
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-mute);
  }
  .head-right .contact {
    color: var(--text);
    text-transform: none;
    letter-spacing: 0;
    font-family: var(--sans);
    font-size: 0.875rem;
    border-bottom: 1px solid var(--line-mid);
    padding-bottom: 1px;
    transition: border-color 200ms ease, color 200ms ease;
  }
  .head-right .contact:hover { border-color: var(--accent); color: var(--accent); }

  /* ===== WORK SECTION ===== */
  .work-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0 0 1.5rem;
    border-bottom: 1px solid var(--line);
    margin-bottom: clamp(2rem, 5vw, 3rem);
  }
  .work-head .label {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-mute);
  }
  .work-head .count {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--text-dim);
    letter-spacing: 0.06em;
  }

  .work-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(2rem, 5vw, 4rem);
    padding-bottom: clamp(4rem, 8vw, 6rem);
  }
  @media (max-width: 820px) {
    .work-grid { grid-template-columns: 1fr; gap: 3rem; }
  }

  /* ===== PROJECT CARD ===== */
  .project {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    cursor: pointer;
    background: transparent;
    border: 0;
    text-align: left;
    color: inherit;
    font-family: inherit;
    padding: 0;
  }
  .project-img-wrap {
    position: relative;
    aspect-ratio: 1280 / 800;
    background: var(--bg-soft);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 24px 48px -28px rgba(24, 22, 20, 0.25),
                0 4px 14px -6px rgba(24, 22, 20, 0.08);
    transition: transform 320ms cubic-bezier(.2, .6, .2, 1), box-shadow 320ms ease;
  }
  .project:hover .project-img-wrap,
  .project:focus-visible .project-img-wrap {
    transform: translateY(-6px);
    box-shadow: 0 32px 64px -32px rgba(24, 22, 20, 0.32),
                0 6px 18px -6px rgba(24, 22, 20, 0.12);
  }
  .project-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }
  .project-img-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 60%, rgba(24, 22, 20, 0.40) 100%);
    opacity: 0;
    transition: opacity 280ms ease;
    pointer-events: none;
  }
  .project:hover .project-img-wrap::after,
  .project:focus-visible .project-img-wrap::after { opacity: 1; }
  .project-img-hint {
    position: absolute;
    bottom: 1rem;
    right: 1rem;
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--bg);
    background: rgba(24, 22, 20, 0.6);
    padding: 0.45rem 0.75rem;
    border-radius: 999px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 280ms ease, transform 280ms ease;
    z-index: 1;
    pointer-events: none;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }
  .project:hover .project-img-hint,
  .project:focus-visible .project-img-hint { opacity: 1; transform: translateY(0); }

  .project-meta { display: flex; flex-direction: column; gap: 0.75rem; }
  .project-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
  }
  .project-name {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(1.75rem, 3vw, 2.25rem);
    letter-spacing: -0.015em;
    line-height: 1;
    color: var(--text);
    transition: color 200ms ease;
  }
  .project:hover .project-name { color: var(--accent); }
  .project-tag {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-mute);
    white-space: nowrap;
  }
  .project-desc {
    font-size: 0.9375rem;
    color: var(--text-mute);
    line-height: 1.55;
    max-width: 38rem;
  }
  .project-cta {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text);
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.25rem;
    transition: color 200ms ease, transform 200ms ease;
  }
  .project-cta span { transition: transform 200ms ease; }
  .project:hover .project-cta { color: var(--accent); }
  .project:hover .project-cta span { transform: translateX(4px); }

  /* ===== MODAL ===== */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(1rem, 3vw, 2rem);
    pointer-events: none;
    opacity: 0;
    transition: opacity 280ms ease;
  }
  .modal.open { opacity: 1; pointer-events: auto; }
  .modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(24, 22, 20, 0.65);
    backdrop-filter: blur(8px) saturate(1.1);
    -webkit-backdrop-filter: blur(8px) saturate(1.1);
  }
  .modal-card {
    position: relative;
    z-index: 1;
    background: var(--bg-elev);
    border-radius: 18px;
    padding: clamp(1.5rem, 3vw, 2.5rem);
    max-width: 1280px;
    width: 100%;
    max-height: 92dvh;
    overflow-y: auto;
    box-shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.5);
    transform: translateY(20px) scale(0.98);
    transition: transform 320ms cubic-bezier(.2, .6, .2, 1);
  }
  .modal.open .modal-card { transform: translateY(0) scale(1); }

  .modal-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1.5rem;
    padding-bottom: 1.5rem;
    margin-bottom: 1.75rem;
    border-bottom: 1px solid var(--line);
  }
  .modal-eyebrow {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-mute);
    margin-bottom: 0.55rem;
  }
  .modal-title {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1.75rem, 3.5vw, 2.5rem);
    letter-spacing: -0.015em;
    line-height: 1.05;
    color: var(--text);
    max-width: 28rem;
  }
  .modal-close {
    background: transparent;
    border: 1px solid var(--line-mid);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    color: var(--text);
    font-size: 1.25rem;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 200ms ease, border-color 200ms ease, color 200ms ease, transform 150ms ease;
  }
  .modal-close:hover { background: var(--text); color: var(--bg); border-color: var(--text); }
  .modal-close:active { transform: scale(0.95); }

  .modal-versions {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: clamp(0.85rem, 2vw, 1.25rem);
  }
  @media (max-width: 720px) {
    .modal-versions { grid-template-columns: 1fr; }
  }

  .modal-version {
    display: flex;
    flex-direction: column;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    color: inherit;
    transition: transform 240ms cubic-bezier(.2, .6, .2, 1), border-color 200ms ease, box-shadow 240ms ease;
    cursor: pointer;
  }
  .modal-version:hover {
    transform: translateY(-4px);
    border-color: var(--text);
    box-shadow: 0 20px 36px -22px rgba(0, 0, 0, 0.4);
  }
  .modal-version img {
    width: 100%;
    aspect-ratio: 1280 / 800;
    object-fit: cover;
    object-position: top center;
    display: block;
    background: var(--bg-soft);
  }
  .modal-version-meta {
    padding: 1rem 1.25rem 1.1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    border-top: 1px solid var(--line);
  }
  .modal-version-meta .num {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.08em;
  }
  .modal-version-meta .label {
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.1rem;
    line-height: 1;
    color: var(--text);
  }
  .modal-version-meta .arrow {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--text-mute);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    margin-left: auto;
    transition: color 200ms ease, transform 200ms ease;
  }
  .modal-version:hover .arrow { color: var(--accent); transform: translateX(3px); }

  /* ===== FOOTER ===== */
  footer {
    padding: 2rem 0 2.5rem;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1.5rem;
    flex-wrap: wrap;
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }
  footer .left { color: var(--text-mute); }
  footer a {
    color: var(--text);
    text-transform: none;
    letter-spacing: 0;
    font-family: var(--sans);
    font-size: 0.875rem;
    border-bottom: 1px solid var(--line-mid);
    padding-bottom: 1px;
    transition: border-color 200ms ease, color 200ms ease;
  }
  footer a:hover { border-color: var(--accent); color: var(--accent); }

  /* ===== ENTRY ANIMATION ===== */
  @media (prefers-reduced-motion: no-preference) {
    .brand, .work-head, .project {
      animation: rise 700ms cubic-bezier(.2, .6, .2, 1) both;
    }
    .work-head { animation-delay: 120ms; }
    .project:nth-of-type(1) { animation-delay: 180ms; }
    .project:nth-of-type(2) { animation-delay: 280ms; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .skip { position: absolute; left: -9999px; top: 1rem; }
  .skip:focus {
    left: 1rem;
    z-index: 200;
    background: var(--bg-elev);
    color: var(--text);
    padding: 0.5rem 1rem;
    border: 1px solid var(--accent);
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 0.75rem;
  }
</style>
</head>
<body>

<a href="#work" class="skip">Saltar para o trabalho</a>

<div class="container">

  <header>
    <div class="head-row">
      <div class="brand">
        <h1>Soma <span class="acc">Studio</span></h1>
        <p class="tagline">Estúdio digital. Sites e produtos web para empresas em Portugal — desenhados à medida, sem templates.</p>
      </div>
      <div class="head-right">
        <span>2024 — 2026</span>
        <a class="contact" href="mailto:hello@somastudio.pt">hello@somastudio.pt</a>
      </div>
    </div>
  </header>

  <main id="work">
    <div class="work-head">
      <span class="label">Trabalho recente</span>
      <span class="count">02 clientes · 06 direções</span>
    </div>
    <div class="work-grid" id="grid"></div>
  </main>

  <footer>
    <span class="left">Soma Studio · MMXXVI</span>
    <a href="mailto:hello@somastudio.pt">hello@somastudio.pt</a>
  </footer>

</div>

<!-- ===== MODAL ===== -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-hidden="true">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <div class="modal-eyebrow" id="modal-eyebrow">—</div>
        <h3 class="modal-title" id="modal-title">Escolha a versão que prefere</h3>
      </div>
      <button class="modal-close" data-close aria-label="Fechar">×</button>
    </div>
    <div class="modal-versions" id="modal-versions"></div>
  </div>
</div>

<script>
  // ============================================================
  // Edita aqui:
  //  - cada projeto tem 'versions' — cada uma com label, img e url
  //  - url é o endereço onde a versão está publicada
  //    (placeholder localhost por agora; mete o URL real quando deploy)
  // ============================================================
  const projects = [
    {
      client: "King's Club",
      tag: "Barbearia",
      desc: "Atelier de barbearia em Torres Vedras. Três direções de design para encontrar a identidade certa para a marca.",
      cover: "img/kingsclub-v1.png",
      versions: [
        { label: "Luxury", img: "img/kingsclub-v1.png", url: "http://localhost:5180/" },
        { label: "Emerald", img: "img/kingsclub-v2.png", url: "http://localhost:5181/" },
        { label: "Atelier", img: "img/kingsclub-v3.png", url: "http://localhost:5182/" }
      ]
    },
    {
      client: "V&J Fonseca",
      tag: "Serralharia",
      desc: "Empresa familiar de serralharia em Palmela. Três aproximações visuais — técnica, atelier e editorial — para representar o ofício.",
      cover: "img/vj-fonseca-vj.png",
      versions: [
        { label: "Folha técnica", img: "img/vj-fonseca-vj.png", url: "http://localhost:5185/VJ/" },
        { label: "Atelier", img: "img/vj-fonseca-atelier.png", url: "http://localhost:5185/atelier/" },
        { label: "Editorial", img: "img/vj-fonseca-editorial.png", url: "http://localhost:5185/editorial/" }
      ]
    }
  ];

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));

  // --- Render cards ---
  document.getElementById('grid').innerHTML = projects.map((p, idx) => `
    <button type="button" class="project" data-project="${idx}" aria-label="Ver as 3 direções de design para ${esc(p.client)}">
      <div class="project-img-wrap">
        <img class="project-img" src="${esc(p.cover)}" alt="${esc(p.client)} — preview" loading="lazy" />
        <span class="project-img-hint">Ver 3 direções →</span>
      </div>
      <div class="project-meta">
        <div class="project-row">
          <h2 class="project-name">${esc(p.client)}</h2>
          <span class="project-tag">${esc(p.tag)}</span>
        </div>
        <p class="project-desc">${esc(p.desc)}</p>
        <span class="project-cta">${p.versions.length} direções <span aria-hidden="true">→</span></span>
      </div>
    </button>
  `).join('');

  // --- Modal logic ---
  const modal = document.getElementById('modal');
  const modalEyebrow = document.getElementById('modal-eyebrow');
  const modalTitle = document.getElementById('modal-title');
  const modalVersions = document.getElementById('modal-versions');
  let lastFocus = null;

  function openModal(project, triggerEl) {
    lastFocus = triggerEl || document.activeElement;
    modalEyebrow.textContent = `${project.client} · ${project.tag}`;
    modalTitle.textContent = 'Escolha a versão que prefere';
    modalVersions.innerHTML = project.versions.map((v, i) => `
      <a class="modal-version" href="${esc(v.url)}" target="_blank" rel="noopener noreferrer" aria-label="Abrir ${esc(project.client)} — ${esc(v.label)}">
        <img src="${esc(v.img)}" alt="${esc(project.client)} — ${esc(v.label)}" />
        <div class="modal-version-meta">
          <span class="num">${String(i + 1).padStart(2, '0')}</span>
          <span class="label">${esc(v.label)}</span>
          <span class="arrow">Abrir <span aria-hidden="true">→</span></span>
        </div>
      </a>
    `).join('');
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.classList.add('modal-open');
    // focus the close button for keyboard users
    modal.querySelector('.modal-close')?.focus();
  }

  function closeModal() {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('modal-open');
    if (lastFocus && typeof lastFocus.focus === 'function') lastFocus.focus();
  }

  // Card click → open modal
  document.querySelectorAll('.project').forEach((card) => {
    card.addEventListener('click', () => {
      const idx = +card.dataset.project;
      openModal(projects[idx], card);
    });
  });

  // Close handlers
  modal.querySelectorAll('[data-close]').forEach((el) => el.addEventListener('click', closeModal));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
  });
</script>

</body>
</html>
